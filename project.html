<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz + Grade System</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
}

/* NAVBAR */
nav{
position:sticky;
top:0;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
z-index:1000;
}

.logo{
font-size:20px;
font-weight:bold;
color:#60a5fa;
}

.menu{
display:flex;
gap:15px;
}

.menu button{
background:#1f2937;
border:none;
padding:10px 15px;
color:white;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.menu button:hover{
background:#2563eb;
transform:scale(1.05);
}

/* LAYOUT */
.container{
max-width:900px;
margin:30px auto;
background:white;
color:black;
padding:25px;
border-radius:15px;
}

/* QUIZ */
.question{
display:none;
}

.question.active{
display:block;
}

label{
display:block;
padding:12px;
margin:10px 0;
background:#f1f5f9;
border-radius:10px;
cursor:pointer;
}

.buttons{
display:flex;
gap:10px;
margin-top:20px;
}

button{
padding:12px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
flex:1;
}

#submit{
display:none;
}

#result{
margin-top:15px;
font-size:22px;
text-align:center;
}

/* GRADE */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.input-box input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
}

.grade-result{
display:none;
margin-top:15px;
padding:15px;
background:#f1f5f9;
border-radius:10px;
}

/* DARK MODE */
.dark body,
body.dark{
background:#020617;
}

body.dark .container{
background:#0f172a;
color:white;
}

body.dark label{
background:#334155;
color:white;
}

body.dark .grade-result{
background:#1e293b;
color:white;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
<div class="logo">📚 Study System</div>

<div class="menu">
<button onclick="showSection('quiz')">🧠 Quiz</button>
<button onclick="showSection('grade')">🎓 Grade</button>
<button onclick="toggleTheme()">🌙 Theme</button>
</div>
</nav>

<!-- QUIZ SECTION -->
<div class="container" id="quiz">

<h2>🧠 Online Quiz</h2>

<div class="question active">
<h3>1. HTML stands for?</h3>
<label><input type="radio" name="q1" value="1"> Hyper Text Markup Language</label>
<label><input type="radio" name="q1" value="0"> High Text</label>
</div>

<div class="question">
<h3>2. CSS used for?</h3>
<label><input type="radio" name="q2" value="1"> Styling</label>
<label><input type="radio" name="q2" value="0"> Database</label>
</div>

<div class="buttons">
<button onclick="prevQ()">Previous</button>
<button onclick="nextQ()">Next</button>
<button onclick="submitQuiz()" id="submit">Submit</button>
</div>

<div id="result"></div>

</div>

<!-- GRADE SECTION -->
<div class="container" id="grade" style="display:none">

<h2>🎓 Student Grade System</h2>

<div class="grid">

<div class="input-box"><label>Somali</label><input id="somali" type="number"></div>
<div class="input-box"><label>Arabic</label><input id="arabic" type="number"></div>
<div class="input-box"><label>Math</label><input id="math" type="number"></div>
<div class="input-box"><label>Physics</label><input id="physics" type="number"></div>
<div class="input-box"><label>English</label><input id="english" type="number"></div>
<div class="input-box"><label>Biology</label><input id="biology" type="number"></div>

</div>

<button onclick="calculate()">Calculate</button>

<div class="grade-result" id="gradeResult">
<p id="total"></p>
<p id="avg"></p>
<p id="gpa"></p>
<p id="gradeText"></p>
</div>

</div>

<script>

/* MENU SWITCH */
function showSection(section){

document.getElementById("quiz").style.display="none";
document.getElementById("grade").style.display="none";

document.getElementById(section).style.display="block";

}

/* QUIZ LOGIC */
let current=0;
const questions=document.querySelectorAll(".question");

function showQ(){

questions.forEach(q=>q.classList.remove("active"));
questions[current].classList.add("active");

document.getElementById("submit").style.display=
current===questions.length-1?"block":"none";

}

function nextQ(){
if(current<questions.length-1){
current++;
showQ();
}
}

function prevQ(){
if(current>0){
current--;
showQ();
}
}

function submitQuiz(){

let score=0;

document.querySelectorAll("input:checked").forEach(x=>{
score+=Number(x.value);
});

document.getElementById("result").innerHTML=
"🎉 Score: "+score;

}

/* GRADE SYSTEM */
function val(id){
return Number(document.getElementById(id).value)||0;
}

function calculate(){

let total=
val("somali")+val("arabic")+val("math")+
val("physics")+val("english")+val("biology");

let avg=total/6;
let gpa=(avg/25).toFixed(2);

let grade="F";

if(avg>=90) grade="A+";
else if(avg>=80) grade="A";
else if(avg>=70) grade="B";
else if(avg>=60) grade="C";

document.getElementById("total").innerText="Total: "+total;
document.getElementById("avg").innerText="Average: "+avg.toFixed(1);
document.getElementById("gpa").innerText="GPA: "+gpa;
document.getElementById("gradeText").innerText="Grade: "+grade;

document.getElementById("gradeResult").style.display="block";
}

/* THEME */
function toggleTheme(){
document.body.classList.toggle("dark");
}

showQ();

</script>

</body>
</html>
